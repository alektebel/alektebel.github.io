<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>learn from scratch — build the systems, pass the checks</title>
<meta name="description" content="Interactive from-scratch implementations with graded checks: AWS, compilers, LLMs, Dynamo, context caching and production debugging. Write the code, run the checker in your browser.">
<meta property="og:title" content="learn from scratch">
<meta property="og:description" content="Build AWS, compilers, LLMs and distributed systems from scratch — run the graded checks in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Ctext x='2' y='13' font-family='monospace' font-size='12' fill='%23ff3b1f'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ed;
    --panel: #efece4;
    --ink: #111110;
    --body: #3c3a35;
    --muted: #6b6862;
    --faint: #9a958b;
    --line: #111110;
    --soft-line: #ddd8cb;
    --accent: #ff3b1f;
    --green: #1f7a3d;
    --yellow: #a8720a;
    --code-bg: #171714;
    --code-ink: #e9e6dd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { color: var(--ink); font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--accent); }
  a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; z-index: 50; }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 12px 22px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand { font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-bottom: 1px solid #c9c4b8; }
  .topbar .title { font-weight: 700; letter-spacing: -0.02em; font-size: 16px; }
  .topbar .title .dot { color: var(--accent); }
  .topbar .grow { flex: 1 1 auto; }
  .topbar .actions { display: flex; align-items: center; gap: 14px; }
  .topbar .actions a { font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-bottom: 1px solid #c9c4b8; }
  .pill {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 10px; border: 1px solid var(--soft-line); color: var(--muted); white-space: nowrap;
  }
  .pill.ready { color: var(--green); border-color: #bcd7c4; }
  .pill.busy { color: var(--accent); border-color: #f1c2b8; }
  .pill.error { color: var(--accent); border-color: var(--accent); }

  /* sign-in + sync */
  .authbox { display: inline-flex; align-items: center; gap: 8px; }
  .authbox .who { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--body); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .authbtn {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 10px; border: 1px solid var(--line); background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .authbtn:hover { background: var(--accent); border-color: var(--accent); }
  .authbtn.plain { background: none; color: var(--muted); border-color: var(--soft-line); text-transform: none; letter-spacing: 0; }
  .authbtn.plain:hover { color: var(--accent); background: none; border-color: var(--accent); }
  #sync-pill { cursor: default; }

  /* learn tree */
  .tree-wrap { position: relative; margin-top: 28px; overflow-x: auto; padding-bottom: 10px; }
  .tree-inner { position: relative; }
  .tree-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .tree-svg path { fill: none; stroke: #c9c4b8; stroke-width: 2; transition: stroke 0.15s; }
  .tree-svg path.ready { stroke: var(--green); }
  .tree-svg path.hot { stroke: var(--accent); stroke-width: 2.5; }
  .tree-cols { display: flex; gap: 76px; align-items: flex-start; padding: 4px 2px 16px; width: max-content; }
  .tree-tier { display: flex; flex-direction: column; gap: 24px; flex: none; }
  .tnode { position: relative; width: 268px; border: 1px solid var(--line); background: var(--panel); padding: 14px 14px 12px; }
  .tnode:hover { border-color: var(--accent); }
  .tnode.done { border-color: var(--green); }
  .tnode .t-open { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; cursor: pointer; text-align: left; }
  .tnode .t-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tnode .t-toggle { position: absolute; top: 10px; right: 10px; border: 1px solid var(--soft-line); background: var(--bg); color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; cursor: pointer; }
  .tnode .t-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .tprog { height: 4px; background: var(--soft-line); margin-top: 9px; }
  .tprog i { display: block; height: 100%; background: var(--green); width: 0; }
  .tchecks { display: none; margin-top: 10px; border-top: 1px dashed var(--soft-line); padding-top: 8px; }
  .tnode.open .tchecks { display: block; }
  .tcheck { display: flex; gap: 9px; align-items: baseline; width: 100%; text-align: left; border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--body); padding: 3px 2px; }
  .tcheck:hover { color: var(--ink); }
  .tcheck .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c4b8; flex: none; align-self: center; }
  .tcheck[data-st="PASS"] .dot { background: var(--green); }
  .tcheck[data-st="FAIL"] .dot { background: var(--accent); }
  .tcheck[data-st="TODO"] .dot { background: var(--yellow); }
  .tcheck .c-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--faint); flex: none; }
  .tree-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .tree-legend .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c4b8; display: inline-block; margin-right: 5px; }

  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: 1400px; margin: 0 auto; }
  /* track nav */
  .tracks { border-right: 1px solid var(--line); padding: 22px 18px 40px; position: sticky; top: 61px; align-self: start; max-height: calc(100vh - 61px); overflow: auto; }
  .tracks .label { margin-bottom: 12px; }
  .tracks button {
    display: block; width: 100%; text-align: left;
    padding: 10px 10px; margin-bottom: 3px;
    border: 1px solid transparent; background: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; color: var(--body);
  }
  .tracks button:hover { border-color: var(--soft-line); color: var(--ink); }
  .tracks button.active { background: var(--ink); color: var(--bg); }
  .tracks button .t-prog { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); margin-top: 3px; }
  .tracks button.active .t-prog { color: #b3aea3; }

  main { min-width: 0; padding: 34px 34px 80px; }
  h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.03; margin: 8px 0 0; }
  .lede { max-width: 66ch; color: var(--body); font-size: 15px; text-wrap: pretty; }
  .lede code, .code-inline { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; background: var(--panel); padding: 1px 5px; }

  /* home cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-top: 26px; }
  .card {
    display: flex; flex-direction: column; gap: 8px;
    padding: 18px 18px 16px; background: var(--panel); border: 1px solid var(--soft-line);
    cursor: pointer; text-align: left; font: inherit; color: inherit;
    transition: border-color 0.16s, transform 0.16s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); color: var(--ink); }
  .card .c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .card .c-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); text-align: right; }
  .card p { margin: 0; font-size: 13.5px; color: var(--body); text-wrap: pretty; }
  .card .c-foot { margin-top: auto; padding-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

  /* track */
  .track-head { border-bottom: 1px solid var(--line); padding-bottom: 22px; }
  .track-head .meta { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 18px; }
  .track-head .meta a { font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-bottom: 1px solid #c9c4b8; }
  .progress { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .refs { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .refs .label { margin-right: 2px; }
  .refs a { font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-bottom: 1px solid #c9c4b8; }
  .refs a:hover { color: var(--accent); border-color: var(--accent); }
  .refs .r-where { font-size: 10px; color: var(--faint); border-bottom: none; }
  .btn {
    padding: 9px 16px; border: 1px solid var(--line); background: var(--ink); color: var(--bg);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .btn.ghost { background: var(--bg); color: var(--ink); }
  .btn.ghost:hover:not(:disabled) { background: var(--ink); color: var(--bg); }

  .track-body { display: grid; grid-template-columns: var(--checks-w, 340px) 10px minmax(0, 1fr); gap: 0 18px; margin-top: 24px; align-items: start; }
  .checks { border-top: 1px solid var(--soft-line); min-width: 0; align-self: start; }
  .vsplit { align-self: stretch; min-height: 260px; cursor: col-resize; touch-action: none; position: relative; }
  .vsplit::after { content: ""; position: absolute; top: 10px; bottom: 10px; left: 4px; width: 2px; background: var(--soft-line); }
  .vsplit:hover::after, .vsplit.dragging::after { background: var(--accent); }
  .hsplit { height: 16px; cursor: row-resize; touch-action: none; position: relative; flex: none; }
  .hsplit::after { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--soft-line); }
  .hsplit:hover::after, .hsplit.dragging::after { background: var(--accent); }
  .file-group { border-bottom: 1px solid var(--soft-line); padding: 12px 0 8px; }
  .file-name { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .file-name .f-count { font-size: 10.5px; color: var(--faint); font-weight: 400; }
  .check-row {
    display: flex; gap: 10px; align-items: baseline; width: 100%;
    padding: 7px 8px; border: 1px solid transparent; background: none; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--body); text-align: left;
  }
  .check-row:hover { background: var(--panel); color: var(--ink); }
  .check-row.sel { border-color: var(--line); background: var(--panel); color: var(--ink); }
  .check-row .badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 1.3em; flex: none; color: var(--faint); }
  .check-row[data-st="PASS"] .badge { color: var(--green); }
  .check-row[data-st="FAIL"] .badge { color: var(--accent); }
  .check-row[data-st="TODO"] .badge { color: var(--yellow); }
  .check-row .c-num { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); flex: none; }

  .work { min-width: 0; }
  .split-x { display: flex; align-items: stretch; gap: 0; min-width: 0; }
  .split-x > .vsplit { flex: 0 0 10px; min-height: 100px; }
  .split-x .guidelines { flex: 0 0 var(--gx-w, 44%); min-width: 220px; max-width: 100%; }
  .edcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .work-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .work-head .wf { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; }
  .work-head a { font-family: 'IBM Plex Mono', monospace; font-size: 11px; border-bottom: 1px solid #c9c4b8; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; text-wrap: pretty; }
  #editor {
    width: 100%; height: 460px; resize: vertical;
    padding: 14px 16px; border: 1px solid var(--line);
    background: var(--code-bg); color: var(--code-ink);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6;
    tab-size: 4; white-space: pre; overflow: auto;
  }
  .work-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 16px; }
  #output {
    margin: 0; flex: none; height: var(--con-h, 180px); min-height: 90px; overflow: auto;
    padding: 14px 16px; border: 1px solid var(--soft-line); background: var(--panel);
    font-family: 'IBM Plex Mono', monospace; font-size: var(--code-size, 13px); line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; color: var(--body);
  }
  #output .oline { min-height: 1.2em; }
  #output .oline.ok { color: var(--green); }
  #output .oline.bad { color: var(--accent); }
  #output .oline.todo { color: var(--yellow); }
  #output .oline.sum { color: var(--ink); font-weight: 600; margin-top: 4px; }
  #output.busy { opacity: 0.7; }

  .links { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; }
  .links .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; margin-top: 14px; }
  .links a { display: block; padding: 12px 14px; border: 1px solid var(--soft-line); background: var(--panel); }
  .links a:hover { border-color: var(--accent); color: var(--ink); }
  .links .l-title { font-size: 14.5px; font-weight: 600; }
  .links .l-blurb { font-size: 12.5px; color: var(--body); margin-top: 4px; }
  .links .l-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }

  .how { margin-top: 34px; border-top: 1px solid var(--soft-line); padding-top: 20px; }
  .how ol { margin: 12px 0 0; padding-left: 20px; color: var(--body); font-size: 14px; max-width: 70ch; }
  .how li { margin-bottom: 6px; }
  .how code { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; background: var(--panel); padding: 1px 5px; }

  /* guidelines + editor */
  .guidelines { border: 1px solid var(--soft-line); border-left: 3px solid var(--accent); background: var(--panel); padding: 16px 18px; overflow: auto; max-height: calc(var(--ed-h, 440px) + 34px); }
  .guidelines .g-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; }
  .guidelines .g-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin-top: 7px; line-height: 1.25; }
  .guidelines .g-body { margin-top: 12px; }
  .guidelines .g-body p { margin: 0 0 11px; font-size: 13.5px; color: var(--body); max-width: 74ch; white-space: pre-wrap; text-wrap: pretty; }
  .guidelines .g-body p.g-decision { border-left: 2px solid var(--accent); padding-left: 11px; color: var(--ink); }
  .guidelines .g-body p:last-child { margin-bottom: 0; }
  .guidelines .g-link { display: inline-block; margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; border-bottom: 1px solid #c9c4b8; }

  .editor-wrap { border: 1px solid var(--line); background: var(--code-bg); }
  .editor-wrap .CodeMirror { height: var(--ed-h, 440px); font-family: 'IBM Plex Mono', monospace; font-size: var(--code-size, 13px); line-height: 1.6; padding: 6px 0; }
  .editor-wrap .CodeMirror-linenumber { color: #5b5952; }
  .editor-wrap textarea.fallback-editor { display: block; width: 100%; height: var(--ed-h, 440px); resize: vertical; padding: 14px 16px; border: 0; background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', monospace; font-size: var(--code-size, 13px); line-height: 1.6; tab-size: 4; }

  .grow { flex: 1 1 auto; }
  .btn.sm { padding: 5px 10px; font-size: 10px; }
  .zoomctl { display: inline-flex; border: 1px solid var(--soft-line); }
  .zbtn { border: none; background: var(--bg); color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 4px 9px; cursor: pointer; }
  .zbtn:hover { background: var(--ink); color: var(--bg); }
  .con-head { display: flex; align-items: center; gap: 10px; border: 1px solid var(--soft-line); border-bottom: none; background: var(--panel); padding: 6px 12px; }
  .con-sum { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

  footer.colophon { margin-top: 50px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint); }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .tracks { position: static; border-right: none; border-bottom: 1px solid var(--line); max-height: none; }
    .track-body { grid-template-columns: 1fr; }
    .vsplit, .hsplit { display: none; }
    .split-x { display: block; }
    .guidelines { max-height: none; margin-bottom: 14px; }
  }

  /* phone-first: topics become a horizontal rail, the editor gets room, the
     run bar stays under the thumb */
  @media (max-width: 700px) {
    main { padding: 20px 14px 80px; }
    .topbar { padding: 10px 14px; }
    .tracks { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
    .tracks .label { display: none; }
    .tracks button { flex: none; width: auto; white-space: nowrap; border: 1px solid var(--soft-line); margin: 0; padding: 8px 12px; }
    .tracks button .t-prog { display: inline; margin-left: 6px; }
    .track-head .meta { gap: 10px 14px; }
    .track-head .meta .btn, .work-actions .btn { flex: 1 1 auto; text-align: center; }
    .guidelines { padding: 14px 14px; }
    .guidelines .g-title { font-size: 16px; }
    .editor-wrap .CodeMirror { height: 54vh; min-height: 320px; font-size: max(16px, var(--code-size, 16px)); line-height: 1.5; }
    .editor-wrap .CodeMirror-linenumber { color: #6b6862; }
    .editor-wrap textarea.fallback-editor { height: 54vh; min-height: 320px; font-size: max(16px, var(--code-size, 16px)); }
    .work-actions { position: sticky; bottom: 0; z-index: 12; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--soft-line); }
    #output { height: 40vh; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" href="/">← diegoatencia.dev</a>
  <div class="title">learn<span class="dot">·</span>from scratch</div>
  <span class="grow"></span>
  <div class="actions">
    <span class="pill" id="runner-pill">python runner idle</span>
    <span class="pill" id="sync-pill" hidden></span>
    <span class="authbox" id="authbox"></span>
    <a href="#tree" data-nav="tree">tree</a>
    <a href="https://github.com/alektebel/learn-stuff-from-scratch" target="_blank" rel="noopener">repo ↗</a>
  </div>
</header>

<div class="layout">
  <nav class="tracks" id="track-nav" aria-label="Tracks"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";
const RAW = "https://raw.githubusercontent.com/alektebel/learn-stuff-from-scratch/main/";
const PYODIDE_VERSION = "v0.26.4";
const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/" + PYODIDE_VERSION + "/full/";
// Filled after deploying backend/template-progress-cfn.yaml (see README).
// Until then the page works exactly as before: localStorage progress, no button.
const PROGRESS_ENDPOINT = "";
const GOOGLE_CLIENT_ID = "";

const state = {
  catalog: null,
  view: { name: "home" },
  track: null,
  sel: null,              // { file, index }
  files: {},              // "dir/name" -> fetched text
  buffers: {},            // "dir/name" -> edited text
  status: {},             // "trackId:index" -> PASS|FAIL|TODO
  auth: null,             // { token, exp, email } while the Google ID token lives
  syncQuiet: false,       // true while applying server state, to avoid echo-push
  py: null,
  pyLoading: false,
  outBuf: ""
};

const mainEl = document.getElementById("main");
const navEl = document.getElementById("track-nav");
const pillEl = document.getElementById("runner-pill");

function setPill(text, cls) {
  pillEl.textContent = text;
  pillEl.className = "pill" + (cls ? " " + cls : "");
}
function stripAnsi(s) { return s.replace(/\x1b\[[0-9;]*m/g, ""); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function byId(id) { return document.getElementById(id); }

/* ── status persistence ── */
function loadStatus(track) {
  try {
    const saved = JSON.parse(localStorage.getItem("lfs:status:" + track.id) || "{}");
    for (const k in saved) state.status[track.id + ":" + k] = saved[k];
  } catch (e) { /* ignore */ }
}
function persistStatus(track) {
  const out = {};
  track.checks.forEach((c, i) => {
    const st = state.status[track.id + ":" + (i + 1)];
    if (st) out[i + 1] = st;
  });
  try { localStorage.setItem("lfs:status:" + track.id, JSON.stringify(out)); } catch (e) { /* ignore */ }
  if (state.auth && !state.syncQuiet) schedulePush();
}
function passedCount(track) {
  let n = 0;
  track.checks.forEach((c, i) => { if (state.status[track.id + ":" + (i + 1)] === "PASS") n++; });
  return n;
}

/* ── Google sign-in + per-user progress sync ──
   The ID token from Google Identity Services is the credential; the Lambda
   checks it with Google and keys the progress row by the account's stable sub.
   Google owns the "remember login" part: the site keeps only the token until
   it expires (~1 h), and one click on "sign in" then completes instantly for
   anyone with a live Google session. Local progress is merged with the server
   set on sign-in, and every PASS you earn is pushed (debounced). Code and
   check output never leave the browser — only the list of passed checks. ── */
const syncPill = document.getElementById("sync-pill");
function setSync(text, cls) {
  if (!PROGRESS_ENDPOINT || !GOOGLE_CLIENT_ID) { syncPill.hidden = true; return; }
  syncPill.hidden = false;
  syncPill.textContent = text;
  syncPill.className = "pill" + (cls ? " " + cls : "");
}

function decodeJwt(t) {
  try {
    const b64 = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { return null; }
}
function loadAuth() {
  try {
    const saved = JSON.parse(localStorage.getItem("lfs:auth") || "null");
    if (saved && saved.token && saved.exp * 1000 > Date.now() + 30000) { state.auth = saved; return state.auth; }
  } catch (e) { /* ignore */ }
  try { localStorage.removeItem("lfs:auth"); } catch (e) { /* ignore */ }
  return null;
}
function saveAuth(claims, token) {
  state.auth = { token: token, exp: claims.exp, email: claims.email || "" };
  try { localStorage.setItem("lfs:auth", JSON.stringify(state.auth)); } catch (e) { /* ignore */ }
  renderAuthBox();
}
function clearAuth() {
  state.auth = null;
  try { localStorage.removeItem("lfs:auth"); } catch (e) { /* ignore */ }
  renderAuthBox();
}
function localPassed() {
  return Object.keys(state.status).filter((k) => state.status[k] === "PASS");
}
function applyServerPassed(list) {
  state.syncQuiet = true;
  try {
    const dirty = {};
    (list || []).forEach((k) => {
      if (state.status[k] !== "PASS") state.status[k] = "PASS";
      dirty[k.split(":")[0]] = true;
    });
    state.catalog.tracks.forEach((t) => { if (dirty[t.id]) persistStatus(t); });
    if (state.view.name === "track" && state.track) { updateBadges(state.track); updateProgress(state.track); }
    renderNav(state.view.name === "track" ? state.track.id : null);
  } finally {
    state.syncQuiet = false;
  }
}

async function apiCall(method, body) {
  if (!state.auth) throw new Error("not signed in");
  const r = await fetch(PROGRESS_ENDPOINT, {
    method: method,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.auth.token },
    body: body == null ? undefined : JSON.stringify(body)
  });
  if (r.status === 401) { clearAuth(); setSync("sign in again to sync", "error"); throw new Error("Google login expired"); }
  if (!r.ok) throw new Error("sync backend " + r.status);
  return r.json();
}
async function syncFromServer() {
  try {
    setSync("syncing…", "busy");
    const got = await apiCall("GET");
    applyServerPassed(got.passed);
    const mine = localPassed();
    if (mine.length) {
      const res = await apiCall("PUT", { passed: mine });
      applyServerPassed(res.passed);
    }
    setSync("progress synced", "ready");
  } catch (e) {
    if (state.auth) setSync("sync offline", "error");
  }
}
let pushTimer = null;
function schedulePush() {
  if (!state.auth || !PROGRESS_ENDPOINT || !GOOGLE_CLIENT_ID) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      setSync("syncing…", "busy");
      const res = await apiCall("PUT", { passed: localPassed() });
      applyServerPassed(res.passed);
      setSync("progress synced", "ready");
    } catch (e) { /* setSync already reacted in apiCall */ }
  }, 500);
}

let gisReady = null;
function initGIS() {
  if (gisReady) return gisReady;
  gisReady = loadScript("https://accounts.google.com/gsi/client").then(() => {
    window.google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: (resp) => {
        const claims = decodeJwt(resp.credential);
        if (!claims) { setSync("bad credential", "error"); return; }
        saveAuth(claims, resp.credential);
        setSync("hello " + (claims.email || ""), "ready");
        syncFromServer();
      }
    });
  });
  return gisReady;
}
async function askGoogle() {
  try {
    await initGIS();
    // One Tap: with a live Google session this is a single "continue as" click.
    window.google.accounts.id.prompt((n) => {
      if (n.isNotDisplayed() || n.isSkippedMoment() || n.isDismissedMoment()) {
        const box = document.getElementById("gis-button");
        if (box && !box.childElementCount) window.google.accounts.id.renderButton(box, { theme: "outline", size: "medium", text: "continue_with" });
      }
    });
  } catch (e) { setSync("could not reach google", "error"); }
}
function renderAuthBox() {
  const box = document.getElementById("authbox");
  if (!GOOGLE_CLIENT_ID || !PROGRESS_ENDPOINT) { box.hidden = true; return; }
  box.hidden = false;
  if (state.auth) {
    box.innerHTML = '<span class="who" title="signed in — progress syncs to your account">' + esc(state.auth.email || "signed in") + '</span>' +
      '<button class="authbtn plain" id="signout">sign out</button>';
    document.getElementById("signout").addEventListener("click", () => {
      clearAuth();
      try { window.google && window.google.accounts && window.google.accounts.id.cancel(); } catch (e) { /* ignore */ }
      setSync("local only", "");
    });
  } else {
    box.innerHTML = '<button class="authbtn" id="signin">sign in · google</button><span id="gis-button"></span>';
    document.getElementById("signin").addEventListener("click", askGoogle);
  }
}
function initAuth() {
  if (!GOOGLE_CLIENT_ID || !PROGRESS_ENDPOINT) return;
  state.catalog.tracks.forEach(loadStatus);
  if (loadAuth()) setSync("syncing…", "busy");
  else setSync("local only", "");
  renderAuthBox();
  if (state.auth) syncFromServer();
}

/* ── buffers ── */
function bufKey(track, file) { return track.dir + "/" + file; }
function bufferFor(track, file) {
  const k = bufKey(track, file);
  if (state.buffers[k] == null) {
    let stored = null;
    try { stored = localStorage.getItem("lfs:buf:" + k); } catch (e) { /* ignore */ }
    state.buffers[k] = stored != null ? stored : state.files[k];
  }
  return state.buffers[k];
}
function saveBuffer(track, file, text) {
  const k = bufKey(track, file);
  state.buffers[k] = text;
  try { localStorage.setItem("lfs:buf:" + k, text); } catch (e) { /* quota */ }
}

/* ── files ── */
async function ensureFiles(track) {
  const need = track.files.concat([track.entry]);
  await Promise.all(need.map(async (name) => {
    const key = track.dir + "/" + name;
    if (state.files[key] != null) return;
    const r = await fetch(RAW + track.dir + "/" + name, { cache: "no-cache" });
    if (!r.ok) throw new Error("could not fetch " + name + " (HTTP " + r.status + ")");
    state.files[key] = await r.text();
  }));
}

/* ── pyodide ── */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error("failed to load " + src));
    document.head.appendChild(s);
  });
}
async function ensurePy() {
  if (state.py) return state.py;
  if (state.pyLoading) {
    while (state.pyLoading) await new Promise((r) => setTimeout(r, 100));
    return state.py;
  }
  state.pyLoading = true;
  setPill("loading python…", "busy");
  try {
    if (!window.loadPyodide) await loadScript(PYODIDE_BASE + "pyodide.js");
    const py = await window.loadPyodide({ indexURL: PYODIDE_BASE });
    // Pyodide batches stdout per line and hands it over WITHOUT the newline,
    // so put it back; without this every printed line runs into the next one
    // and the checker's `✓ 1. file` rows cannot be parsed.
    const line = (s) => appendOut(/\n$/.test(s) ? s : s + "\n");
    py.setStdout({ batched: line });
    py.setStderr({ batched: line });
    state.py = py;
    return py;
  } finally {
    state.pyLoading = false;
  }
}

/* ── output ── */
function appendOut(s) { state.outBuf += s; renderOut(); }
function renderOut() {
  const out = byId("output");
  if (!out) return;
  out.innerHTML = "";
  stripAnsi(state.outBuf).split("\n").forEach((line) => {
    const div = document.createElement("div");
    div.className = "oline";
    const t = line.replace(/\s+$/, "");
    if (t.indexOf("✓") !== -1) div.classList.add("ok");
    else if (t.indexOf("✗") !== -1) div.classList.add("bad");
    else if (t.indexOf("·") !== -1) div.classList.add("todo");
    else if (/passing|failing|to write/.test(t)) div.classList.add("sum");
    div.textContent = t;
    out.appendChild(div);
  });
}
function parseStatuses(track, text) {
  stripAnsi(text).split("\n").forEach((line) => {
    const m = line.match(/^\s*([✓·✗])\s+(\d+)\./);
    if (!m) return;
    const idx = parseInt(m[2], 10);
    state.status[track.id + ":" + idx] = m[1] === "✓" ? "PASS" : m[1] === "·" ? "TODO" : "FAIL";
  });
  persistStatus(track);
  updateBadges(track);
  updateProgress(track);
}

/* ── run ── */
async function run(track, index) {
  const out = byId("output");
  if (out) { out.classList.add("busy"); }
  state.outBuf = "";
  renderOut();
  const runBtn = byId("run-all");
  if (runBtn) runBtn.disabled = true;
  try {
    await ensureFiles(track);
    const py = await ensurePy();
    setPill("running…", "busy");
    const dir = "/work/" + track.dir;
    try { py.FS.mkdirTree(dir); } catch (e) { /* exists */ }
    track.files.concat([track.entry]).forEach((name) => {
      const key = track.dir + "/" + name;
      const text = state.buffers[key] != null ? state.buffers[key] : state.files[key];
      py.FS.writeFile(dir + "/" + name, text);
    });
    const args = index == null ? '["--all"]' : '["' + index + '"]';
    const code = [
      "import os, sys, importlib.util",
      "os.chdir(" + JSON.stringify(dir) + ")",
      "sys.path.insert(0, os.getcwd())",
      'spec = importlib.util.spec_from_file_location("checkmod", "check.py")',
      "mod = importlib.util.module_from_spec(spec)",
      "spec.loader.exec_module(mod)",
      "mod.main(" + args + ")"
    ].join("\n");
    await py.runPythonAsync(code);
    parseStatuses(track, state.outBuf);
    setPill("runner ready", "ready");
  } catch (err) {
    let msg = err && err.message ? err.message : String(err);
    if (/HTTP 404/.test(msg) || /could not fetch/.test(msg)) {
      msg += "\n\nThis track is not on main yet. Push its directory to " +
             "alektebel/learn-stuff-from-scratch (branch main) and the runner will pick it up.";
    }
    appendOut("\n" + msg);
    setPill("runner error", "error");
  } finally {
    if (out) out.classList.remove("busy");
    if (runBtn) runBtn.disabled = false;
  }
}

/* ── DOM: update helpers ── */
function badge(st) {
  if (st === "PASS") return "✓";
  if (st === "FAIL") return "✗";
  if (st === "TODO") return "·";
  return "○";
}
function updateBadges(track) {
  track.checks.forEach((c, i) => {
    const row = document.querySelector('.check-row[data-id="' + (i + 1) + '"]');
    if (!row) return;
    const st = state.status[track.id + ":" + (i + 1)] || "";
    row.setAttribute("data-st", st);
    const b = row.querySelector(".badge");
    if (b) b.textContent = badge(st);
  });
}
function updateProgress(track) {
  const el = byId("progress");
  if (el) el.textContent = passedCount(track) + " / " + track.checks.length + " passing";
}

/* ── render: home ── */
function renderHome() {
  state.view = { name: "home" };
  state.cm = null; state.ta = null; state.editorReady = false;
  const c = state.catalog;  const cards = c.tracks.map((t) => {
    loadStatus(t);
    const p = passedCount(t);
    return '<button class="card" data-nav="track" data-id="' + t.id + '">' +
      '<div class="c-top"><h3>' + esc(t.title) + '</h3><span class="c-tag">' + esc(t.tagline) + '</span></div>' +
      '<p>' + esc(t.blurb) + '</p>' +
      '<div class="c-foot"><span>open track →</span><span>' + p + ' / ' + t.checks.length + ' passing</span></div>' +
      '</button>';
  }).join("");
  const links = c.links.map((l) =>
    '<a href="https://github.com/' + c.repo + '/tree/' + c.ref + '/' + l.dir + '" target="_blank" rel="noopener">' +
    '<div class="l-title">' + esc(l.title) + '</div>' +
    '<div class="l-blurb">' + esc(l.blurb) + '</div>' +
    '<div class="l-tag">' + esc(l.tag) + ' · source</div></a>').join("");

  mainEl.innerHTML =
    '<div class="label">from scratch · graded</div>' +

    '<p class="lede">A from-scratch implementation is not finished when it runs — it is finished when the ' +
    'checker says so. Each track gives you templates with <code>raise NotImplementedError</code>, a ' +
    '<code>check.py</code> that grades <em>your</em> code and names the likely cause when it fails, and a ' +
    'run button that executes the checker in your browser. No install.</p>' +
    '<div class="cards">' + cards + '</div>' +
    '<p class="lede" style="margin-top:16px"><a href="#tree" data-nav="tree">see the whole path as an interactive tree →</a></p>' +
    '<div class="how"><div class="label">how to work through a track</div><ol>' +
    '<li>Open a check, read the docstring in the template — it names the design decision and the failure it avoids.</li>' +
    '<li>Implement the function, hit <span class="code-inline">Run</span>. The checker tells you what to build next.</li>' +
    '<li>When it is green, read <span class="code-inline">solutions/</span> and predict the numbers before you look.</li>' +
    '</ol></div>' +
    '<div class="links"><div class="label">more from-scratch tracks — source on github</div>' +

/* ── render: track ── */
function renderTrack(track) {
  state.view = { name: "track", id: track.id };
  state.track = track;
  state.sel = null;
  // the editor DOM is about to be replaced; drop the old CodeMirror instance
  state.cm = null; state.ta = null; state.editorReady = false;
  loadStatus(track);

  const groups = [];
  let current = null;
  track.checks.forEach((c, i) => {
    if (!current || current.file !== c.file) {
      current = { file: c.file, rows: [] };
      groups.push(current);
    }
    current.rows.push({ index: i + 1, title: c.title });
  });

  const refsHtml = (track.references || []).map((r) =>
    '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" title="maps to ' + esc(r.where) + '">' +
    esc(r.title) + ' <span class="r-where">' + esc(r.where) + '</span></a>').join("");

  const checksHtml = groups.map((g) => {
    const rows = g.rows.map((r) => {
      const st = state.status[track.id + ":" + r.index] || "";
      return '<button class="check-row" data-id="' + r.index + '" data-file="' + esc(g.file) + '" data-st="' + st + '">' +
        '<span class="badge">' + badge(st) + '</span>' +
        '<span class="c-num">' + r.index + '</span>' +
        '<span>' + esc(r.title) + '</span></button>';
    }).join("");
    return '<div class="file-group"><div class="file-name"><span>' + esc(g.file) + '</span>' +
      '<span class="f-count">' + g.rows.length + '</span></div>' + rows + '</div>';
  }).join("");

  mainEl.innerHTML =
    '<div class="track-head">' +
      '<div class="label">track</div>' +
      '<h1>' + esc(track.title) + '</h1>' +
      '<p class="lede">' + esc(track.blurb) + '</p>' +
      '<div class="meta">' +
        '<button class="btn" id="run-all">Run all checks</button>' +
        '<a href="https://github.com/' + state.catalog.repo + '/tree/' + state.catalog.ref + '/' + track.dir + '" target="_blank" rel="noopener">readme &amp; source ↗</a>' +
        '<span class="progress" id="progress">' + passedCount(track) + ' / ' + track.checks.length + ' passing</span>' +
      '</div>' +
      ((track.references || []).length
        ? '<div class="refs"><span class="label">study</span>' + refsHtml + '</div>'
        : "") +
    '</div>' +
    '<div class="track-body" id="track-body">' +
      '<aside class="checks" aria-label="Checks">' + checksHtml + '</aside>' +
      '<div class="vsplit" data-split="checks" title="Drag to resize"></div>' +
      '<section class="work">' +
        '<p class="hint" id="work-hint">Pick a topic to open the guidelines and its editor. ' +
        'Drag any divider to resize, use A&minus;/A+ (or Ctrl+scroll) for code size. Everything runs in the browser.</p>' +
        '<div class="split-x" id="split-x">' +
          '<div id="guidelines" class="guidelines" hidden></div>' +
          '<div class="vsplit x" data-split="gx" id="split-gx" hidden title="Drag to resize"></div>' +
          '<div class="edcol" id="edcol">' +
            '<div class="work-head">' +
              '<span class="wf" id="work-file">select a topic</span>' +
              '<span class="grow"></span>' +
              '<span class="zoomctl" title="Code size (Ctrl+scroll too)">' +
                '<button class="zbtn" id="font-minus" title="Smaller (Ctrl -)">A&minus;</button>' +
                '<button class="zbtn" id="font-plus" title="Bigger (Ctrl +)">A+</button>' +
              '</span>' +
              '<a id="work-gh" href="#" target="_blank" rel="noopener" hidden>view source ↗</a>' +
            '</div>' +
            '<div id="editor-wrap" class="editor-wrap" hidden></div>' +
            '<div class="hsplit" data-split="eo" id="split-eo" hidden title="Drag to resize console"></div>' +
            '<pre id="output" aria-live="polite"></pre>' +
          '</div>' +
        '</div>' +
        '<div class="work-actions" id="work-actions" hidden>' +
          '<button class="btn" id="run-check">Run checks</button>' +
          '<button class="btn ghost" id="reset-file">Reset</button>' +
          '<button class="btn ghost" id="load-sol">Solution</button>' +
        '</div>' +
      '</section>' +
    '</div>';

  byId("run-all").addEventListener("click", () => run(track, null));
  document.querySelectorAll(".check-row").forEach((row) => {
    row.addEventListener("click", () => selectCheck(track, row.getAttribute("data-file"), parseInt(row.getAttribute("data-id"), 10)));
  });
  byId("output").textContent = "Ready. The first run loads the Python runtime (about 10 MB, once).";
  wireSplits();
  applyFont();
}

async function selectCheck(track, file, index) {
  state.sel = { file: file, index: index };
  document.querySelectorAll(".check-row").forEach((r) => r.classList.remove("sel"));
  const row = document.querySelector('.check-row[data-id="' + index + '"]');
  if (row) row.classList.add("sel");

  const check = track.checks[index - 1] || { file: file, title: "" };
  byId("work-file").textContent = file;
  byId("work-hint").hidden = true;

  const gh = byId("work-gh");
  gh.hidden = false;
  gh.href = "https://github.com/" + state.catalog.repo + "/blob/" + state.catalog.ref + "/" + track.dir + "/" + file;

  const runCheck = byId("run-check");
  runCheck.onclick = () => run(track, index);
  byId("reset-file").onclick = () => {
    if (!confirm("Reset " + file + " to the template? Your edits to this file are lost.")) return;
    const key = bufKey(track, file);
    state.buffers[key] = state.files[key];
    try { localStorage.removeItem("lfs:buf:" + key); } catch (e) { /* ignore */ }
    editorSet(state.files[key] || "");
  };
  byId("load-sol").onclick = async () => {
    if (!confirm("Replace the editor with the complete solution in solutions/" + file + "? Try it yourself first.")) return;
    try {
      const r = await fetch(RAW + track.dir + "/solutions/" + file, { cache: "no-cache" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      editorSet(await r.text());
    } catch (err) {
      byId("work-hint").hidden = false;
      byId("work-hint").textContent = "No solution file available (" + (err.message || err) + ").";
    }
  };

  // Fetch the template first, then show guidelines + editor together, so a
  // phone user never sees an empty box while the source is in flight.
  let src = "";
  try {
    await ensureFiles(track);
    state.buffers[bufKey(track, file)] = bufferFor(track, file) || "";
    src = state.buffers[bufKey(track, file)];
  } catch (err) {
    byId("work-hint").hidden = false;
    byId("work-hint").textContent = "Could not load " + file + ": " + (err.message || err);
  }

  renderGuidelines(index, file, check.title, extractDocstring(state.files[bufKey(track, file)] || ""));
  byId("guidelines").hidden = false;
  byId("split-gx").hidden = false;
  byId("editor-wrap").hidden = false;
  byId("split-eo").hidden = false;
  byId("work-actions").hidden = false;
  await mountEditor();
  editorSet(src);

  if (window.matchMedia("(max-width: 700px)").matches) {
    setTimeout(() => { const g = byId("guidelines"); if (g) g.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  }
}

/* ── guidelines: the template docstring, above the code ── */
function extractDocstring(src) {
  const m = String(src).match(/^\s*("""|''')([\s\S]*?)\1/);
  if (!m) return "";
  return m[2]
    .split("\n")
    .filter((line) => !/Complete Solution/i.test(line))
    .join("\n")
    .replace(/^\s+|\s+$/g, "");
}

function renderGuidelines(index, file, title, doc) {
  const box = byId("guidelines");
  box.innerHTML = "";
  const head = document.createElement("div");
  head.className = "g-head";
  head.textContent = "challenge " + index + " · " + file;
  const h = document.createElement("div");
  h.className = "g-title";
  h.textContent = title || "Implement " + file;
  box.append(head, h);

  if (doc) {
    const body = document.createElement("div");
    body.className = "g-body";
    doc.split(/\n\s*\n/).forEach((para) => {
      const p = document.createElement("p");
      if (/^\s*DESIGN DECISION/.test(para)) p.className = "g-decision";
      p.textContent = para.replace(/^\s+|\s+$/g, "");
      body.appendChild(p);
    });
    box.appendChild(body);
  }
  const link = document.createElement("a");
  link.className = "g-link";
  link.href = "https://github.com/" + state.catalog.repo + "/tree/" + state.catalog.ref + "/" + state.track.dir;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = "full readme on github ↗";
  box.appendChild(link);
}

/* ── editor: CodeMirror 5 with a plain-textarea fallback ── */
function addCss(href) {
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = href;
  document.head.appendChild(l);
}
async function mountEditor() {
  if (state.editorReady) return;
  const wrap = byId("editor-wrap");
  try {
    if (typeof window.CodeMirror === "undefined") {
      addCss("https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css");
      addCss("https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js");
    }
    state.cm = window.CodeMirror(wrap, {
      value: "",
      mode: "python",
      theme: "material-darker",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      lineWrapping: window.matchMedia("(max-width: 700px)").matches,
      extraKeys: { Tab: (cm) => cm.replaceSelection("    ") }
    });
    state.cm.on("change", () => {
      if (state.sel) saveBuffer(state.track, state.sel.file, state.cm.getValue());
    });
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.id = "editor";
    ta.className = "fallback-editor";
    ta.spellcheck = false;
    ta.setAttribute("aria-label", "Code editor");
    ta.addEventListener("input", () => { if (state.sel) saveBuffer(state.track, state.sel.file, ta.value); });
    wrap.appendChild(ta);
    state.ta = ta;
  }
  state.editorReady = true;
}
function editorGet() { return state.cm ? state.cm.getValue() : (state.ta ? state.ta.value : ""); }
function editorSet(value) {
  const v = value || "";
  if (state.cm) state.cm.setValue(v);
  else if (state.ta) state.ta.value = v;
  if (state.sel) saveBuffer(state.track, state.sel.file, v);
}

/* ── split panes + code size, LeetCode style ── */
const SIZE_KEY = "lfs:splits";
const FONT_KEY = "lfs:codefont";
function savedSizes() { try { return JSON.parse(localStorage.getItem(SIZE_KEY) || "{}"); } catch (e) { return {}; } }
function saveSize(name, value) { const s = savedSizes(); s[name] = value; try { localStorage.setItem(SIZE_KEY, JSON.stringify(s)); } catch (e) { /* quota */ } }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function cssVar(name, fallback) {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  return isNaN(v) ? fallback : v;
}
function refreshCm() { if (state.cm) setTimeout(() => state.cm.refresh(), 0); }

function attachDrag(el, axis, onDown, onDrag, onUp, scale) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button) return;
    e.preventDefault();
    el.classList.add("dragging");
    document.body.style.userSelect = "none";
    const p0 = axis === "x" ? e.clientX : e.clientY;
    const sc = scale ? scale() : 1;
    const base = onDown();
    const move = (ev) => onDrag(base + (axis === "x" ? ev.clientX - p0 : ev.clientY - p0) * sc);
    const up = () => {
      el.classList.remove("dragging");
      document.body.style.userSelect = "";
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      if (onUp) onUp();
      refreshCm();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}

function wireSplits() {
  const tb = byId("track-body");
  const s = savedSizes();
  if (s.checks) tb.style.setProperty("--checks-w", clamp(s.checks, 200, 640) + "px");
  if (s.gx) document.documentElement.style.setProperty("--gx-w", clamp(s.gx, 20, 75) + "%");
  if (s.ed) document.documentElement.style.setProperty("--ed-h", s.ed + "px");
  if (s.con) document.documentElement.style.setProperty("--con-h", s.con + "px");

  attachDrag(
    document.querySelector('[data-split="checks"]'), "x",
    () => parseFloat(tb.style.getPropertyValue("--checks-w")) || cssVar("--checks-w", 340),
    (px) => tb.style.setProperty("--checks-w", clamp(px, 200, 640) + "px"),
    () => saveSize("checks", parseFloat(tb.style.getPropertyValue("--checks-w")) || 340)
  );

  const gx = byId("split-gx");
  attachDrag(gx, "x",
    () => cssVar("--gx-w", 44),
    (pct) => document.documentElement.style.setProperty("--gx-w", clamp(pct, 20, 75) + "%"),
    () => saveSize("gx", cssVar("--gx-w", 44)),
    () => 100 / (byId("split-x").clientWidth || 1)
  );
  gx.addEventListener("dblclick", () => {
    document.documentElement.style.setProperty("--gx-w", "44%");
    saveSize("gx", 44); refreshCm();
  });

  const eo = byId("split-eo");
  let total = 0;
  attachDrag(eo, "y",
    () => {
      const ed = cssVar("--ed-h", 440), con = cssVar("--con-h", 180);
      total = ed + con;
      return ed;
    },
    (px) => {
      const ed = clamp(px, 140, total - 90);
      document.documentElement.style.setProperty("--ed-h", ed + "px");
      document.documentElement.style.setProperty("--con-h", (total - ed) + "px");
    },
    () => {
      saveSize("ed", Math.round(cssVar("--ed-h", 440)));
      saveSize("con", Math.round(cssVar("--con-h", 180)));
    }
  );
  eo.addEventListener("dblclick", () => {
    document.documentElement.style.setProperty("--ed-h", "440px");
    document.documentElement.style.setProperty("--con-h", "180px");
    saveSize("ed", 440); saveSize("con", 180); refreshCm();
  });

  byId("font-minus").addEventListener("click", () => bumpFont(-1));
  byId("font-plus").addEventListener("click", () => bumpFont(1));
  const wrap = byId("editor-wrap");
  wrap.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    bumpFont(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
}

function currentFont() {
  const v = parseInt(localStorage.getItem(FONT_KEY) || "0", 10);
  if (v >= 10) return v;
  return window.matchMedia("(max-width: 700px)").matches ? 16 : 13;
}
function bumpFont(d) {
  try { localStorage.setItem(FONT_KEY, String(clamp(currentFont() + d, 10, 24))); } catch (e) { /* ignore */ }
  applyFont();
}
function applyFont() {
  document.documentElement.style.setProperty("--code-size", currentFont() + "px");
  refreshCm();
}

/* ── render: the interactive learn tree ── */
function trackDepths() {
  const byIdMap = {};
  state.catalog.tracks.forEach((t) => { byIdMap[t.id] = t; });
  const depth = {};
  function calc(t, seen) {
    if (depth[t.id] != null) return depth[t.id];
    if (seen.has(t.id)) return 0;
    seen.add(t.id);
    let d = 0;
    (t.requires || []).forEach((r) => {
      if (byIdMap[r]) d = Math.max(d, calc(byIdMap[r], seen) + 1);
    });
    seen.delete(t.id);
    depth[t.id] = d;
    return d;
  }
  state.catalog.tracks.forEach((t) => calc(t, new Set()));
  return depth;
}

function renderTree() {
  state.view = { name: "tree" };
  state.cm = null; state.ta = null; state.editorReady = false;
  renderNav();
  const depths = trackDepths();
  const tiers = {};
  state.catalog.tracks.forEach((t) => {
    const d = depths[t.id] || 0;
    (tiers[d] = tiers[d] || []).push(t);
  });
  const cols = Object.keys(tiers).map(Number).sort((a, b) => a - b).map((d) => {
    const nodes = tiers[d].map((t) => {
      loadStatus(t);
      const p = passedCount(t);
      const done = p === t.checks.length;
      const rows = t.checks.map((c, i) => {
        const st = state.status[t.id + ":" + (i + 1)] || "";
        return '<button class="tcheck" data-track="' + t.id + '" data-file="' + esc(c.file) + '" data-index="' + (i + 1) + '" data-st="' + st + '">' +
          '<span class="dot"></span><span class="c-num">' + (i + 1) + '</span><span>' + esc(c.title) + '</span></button>';
      }).join("");
      const req = (t.requires || []).length ? '<div class="t-count">needs ' + esc(t.requires.join(", ")) + '</div>' : "";
      return '<div class="tnode' + (done ? " done" : "") + '" data-track="' + t.id + '">' +
        '<button class="t-toggle" title="expand / collapse checks">checks</button>' +
        '<div class="t-open" data-nav="track" data-id="' + t.id + '">' + esc(t.title) + '</div>' +
        '<div class="t-count">' + p + ' / ' + t.checks.length + ' passing</div>' + req +
        '<div class="tprog"><i style="width:' + (100 * p / t.checks.length) + '%"></i></div>' +
        '<div class="tchecks">' + rows + '</div>' +
      '</div>';
    }).join("");
    return '<div class="tree-tier"><div class="label">stage ' + (d + 1) + '</div>' + nodes + '</div>';
  }).join("");

  mainEl.innerHTML =
    '<div class="label">the tree · what unlocks what</div>' +
    '<h1>Every track, in the order it bites.</h1>' +
    '<p class="lede">Arrows point from what you should pass first to what builds on it: context caching ' +
    'needs the KV cache from the LLM track, Dynamo needs the storage primitives from AWS, and deploy-and-debug ' +
    'assumes you can already build and serve all of it. Expand a node to see its checks; the dots are live ' +
    'from your progress.</p>' +
    '<div class="tree-wrap" id="tree-wrap"><div class="tree-inner">' +
      '<svg class="tree-svg" id="tree-svg" aria-hidden="true"></svg>' +
      '<div class="tree-cols">' + cols + '</div>' +
    '</div></div>' +
    '<div class="tree-legend">' +
      '<span><span class="dot"></span>untried</span>' +
      '<span><span class="dot" style="background:var(--green)"></span>passing</span>' +
      '<span><span class="dot" style="background:var(--accent)"></span>failing</span>' +
      '<span><span class="dot" style="background:var(--yellow)"></span>started, not yet passing</span>' +
      '<span>click the title to open the track · <b>checks</b> to expand · click a check to go straight to it</span>' +
    '</div>';

  document.querySelectorAll(".tnode").forEach((node) => {
    const id = node.getAttribute("data-track");
    node.addEventListener("mouseenter", () => setHotEdge(id, true));
    node.addEventListener("mouseleave", () => setHotEdge(id, false));
    node.querySelector(".t-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      node.classList.toggle("open");
      requestAnimationFrame(drawTreeEdges);
    });
    node.addEventListener("click", (e) => {
      if (e.target.closest(".t-toggle, .tcheck, [data-nav]")) return;
      const t = state.catalog.tracks.find((x) => x.id === id);
      if (t) { renderNav(id); renderTrack(t); history.replaceState(null, "", "#" + id); window.scrollTo(0, 0); }
    });
  });
  document.querySelectorAll(".tcheck").forEach((row) => {
    row.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = row.getAttribute("data-track");
      const t = state.catalog.tracks.find((x) => x.id === id);
      if (!t) return;
      renderNav(id); renderTrack(t);
      history.replaceState(null, "", "#" + id);
      window.scrollTo(0, 0);
      selectCheck(t, row.getAttribute("data-file"), parseInt(row.getAttribute("data-index"), 10));
    });
  });
  requestAnimationFrame(() => requestAnimationFrame(drawTreeEdges));
  setTimeout(drawTreeEdges, 400); // once webfonts have swapped and boxes settle
}

function setHotEdge(id, on) {
  document.querySelectorAll('#tree-svg path[data-to="' + id + '"]').forEach((p) => p.classList.toggle("hot", on));
}

function drawTreeEdges() {
  const svg = byId("tree-svg"), wrap = byId("tree-wrap");
  if (!svg || !wrap) return;
  const inner = wrap.querySelector(".tree-inner");
  const wr = inner.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + inner.clientWidth + " " + inner.clientHeight);
  svg.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  state.catalog.tracks.forEach((t) => {
    (t.requires || []).forEach((rid) => {
      const from = document.querySelector('.tnode[data-track="' + rid + '"]');
      const to = document.querySelector('.tnode[data-track="' + t.id + '"]');
      if (!from || !to) return;
      const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
      const x1 = a.right - wr.left, y1 = a.top - wr.top + a.height / 2;
      const x2 = b.left - wr.left - 2, y2 = b.top - wr.top + b.height / 2;
      const dx = Math.max(30, (x2 - x1) / 2);
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M " + x1 + " " + y1 + " C " + (x1 + dx) + " " + y1 + ", " + (x2 - dx) + " " + y2 + ", " + x2 + " " + y2);
      p.setAttribute("data-to", t.id);
      p.setAttribute("data-from", rid);
      const rt = state.catalog.tracks.find((x) => x.id === rid);
      if (rt && passedCount(rt) === rt.checks.length) p.classList.add("ready");
      svg.appendChild(p);
    });
  });
}

/* ── render: nav ── */
function renderNav(activeId) {
  navEl.innerHTML = '<div class="label">tracks</div>' +
    state.catalog.tracks.map((t) => {
      loadStatus(t);
      return '<button data-nav="track" data-id="' + t.id + '"' + (t.id === activeId ? ' class="active"' : "") + '>' +
        esc(t.title) + '<span class="t-prog">' + passedCount(t) + ' / ' + t.checks.length + '</span></button>';
    }).join("") +
    '<button data-nav="tree"' + (!activeId && state.view.name === "tree" ? ' class="active"' : "") + '>the tree<span class="t-prog">dependency map</span></button>';
}

/* ── navigation (delegated) ── */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-nav]");
  if (!el) return;
  if (el.getAttribute("data-nav") === "home") { history.replaceState(null, "", location.pathname); renderNav(); renderHome(); window.scrollTo(0, 0); return; }
  if (el.getAttribute("data-nav") === "tree") { history.replaceState(null, "", "#tree"); renderNav(); renderTree(); window.scrollTo(0, 0); return; }
  const track = state.catalog.tracks.find((t) => t.id === el.getAttribute("data-id"));
  if (!track) return;
  renderNav(track.id);
  renderTrack(track);
  history.replaceState(null, "", "#" + track.id);
  window.scrollTo(0, 0);
});

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === "Enter") {
    if (state.track && document.getElementById("run-check")) {
      e.preventDefault();
      run(state.track, state.sel ? state.sel.index : null);
    }
    return;
  }
  if (mod && (e.key === "=" || e.key === "+")) { e.preventDefault(); bumpFont(1); return; }
  if (mod && e.key === "-") { e.preventDefault(); bumpFont(-1); return; }
  if (mod && e.key === "0") { e.preventDefault(); try { localStorage.removeItem(FONT_KEY); } catch (er) { /* ignore */ } applyFont(); return; }
  if (e.key === "Tab" && e.target && e.target.id === "editor") {
    e.preventDefault();
    const t = e.target;
    const s = t.selectionStart, en = t.selectionEnd;
    t.value = t.value.slice(0, s) + "    " + t.value.slice(en);
    t.selectionStart = t.selectionEnd = s + 4;
    t.dispatchEvent(new Event("input"));
  }
});

/* ── boot ── */
(async function boot() {
  try {
    const r = await fetch("catalog.json", { cache: "no-cache" });
    state.catalog = await r.json();
  } catch (e) {
    mainEl.innerHTML = "<h1>Could not load catalog.json</h1><p class=\"lede\">Serve this page over HTTP (not file://) so the catalog and the source files can be fetched.</p>";
    return;
  }
  renderNav();
  applyFont();
  initAuth();
  const initial = decodeURIComponent(location.hash.slice(1));
  if (initial === "tree") { renderNav(); renderTree(); return; }
  const initialTrack = initial && state.catalog.tracks.find((t) => t.id === initial);
  if (initialTrack) { renderNav(initialTrack.id); renderTrack(initialTrack); }
  else renderHome();
})();
</script>
